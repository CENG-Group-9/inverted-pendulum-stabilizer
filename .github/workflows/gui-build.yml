name: Build GUI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libglfw3-dev libgl1-mesa-dev \
            libassimp-dev libx11-dev

      - name: Configure
        working-directory: src/gui
        run: cmake --preset debug

      - name: Build
        working-directory: src/gui
        run: cmake --build --preset debug --parallel
