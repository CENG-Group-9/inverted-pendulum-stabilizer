name: Build C++ GUI

# 1. When should this run? Every time someone pushes or opens a pull request.
on: [push, pull_request]

jobs:
  build-ubuntu:
    # 2. What OS should the GitHub virtual machine use?
    runs-on: ubuntu-latest

    steps:
      # 3. Pulls repository code into the virtual machine
      - name: Checkout Code
        uses: actions/checkout@v4

      # 4. Installs the build tools and the GLFW/OpenGL development packages
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libglfw3-dev libgl1-mesa-dev

      # 5. Navigates to GUI folder and configures it using release preset.
      - name: Configure
        working-directory: src/gui
        run: cmake --preset release

      # 6. Compiles the GUI
      - name: Compile GUI
        working-directory: src/gui
        run: cmake --build --preset release
